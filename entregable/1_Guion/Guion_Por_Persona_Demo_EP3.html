<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>[hidden]{display:none!important}</style>
<title>Guion demo MongoDB</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: barra fija con una pestaña por persona; cada paso es una tarjeta con Haces, frase en globo, Aparece y Qué significa. */
:root {
  --bg: #F1F3F8;
  --surface: #FFFFFF;
  --ink: #152033;
  --muted: #566378;
  --line: #DCE2EC;
  --line-strong: #B9C3D3;
  --haces: #ECEFF4;
  --aparece: #FFF0C7;
  --aparece-ink: #6E4A00;
  --pasa: #FFE2D0;
  --pasa-ink: #8E3A0B;
  --rosa: #2563C9;  --rosa-soft: #E7F0FD;  --rosa-mark: #C7DCFA;  --rosa-ink: #173F86;
  --cris: #17794E;  --cris-soft: #E2F4EB;  --cris-mark: #BCE5D1;  --cris-ink: #0F5636;
  --dani: #6B3FD0;  --dani-soft: #EEE8FC;  --dani-mark: #D8CBF5;  --dani-ink: #4A2796;
  --neutral: #3A475C; --neutral-soft: #E9EDF3; --neutral-mark: #D2D9E4; --neutral-ink: #26324A;
  --on-c: #FFFFFF;
  --shadow: 0 1px 2px rgba(20,32,51,.06), 0 6px 18px rgba(20,32,51,.05);
  --font-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --font-body: "Inter", "Segoe UI", system-ui, sans-serif;
  --font-mono: "JetBrains Mono", Consolas, "Courier New", monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0D121A; --surface: #161D29; --ink: #E7ECF5; --muted: #9AA7BC; --line: #263143; --line-strong: #3A4960;
    --haces: #1F2837; --aparece: #3A3014; --aparece-ink: #F3D58A; --pasa: #3D2417; --pasa-ink: #FFC6A3;
    --rosa: #7DAAFF; --rosa-soft: #17284A; --rosa-mark: #27437A; --rosa-ink: #BDD3FF;
    --cris: #5CD09B; --cris-soft: #12301F; --cris-mark: #1F5238; --cris-ink: #A5EBC9;
    --dani: #AC8BFF; --dani-soft: #2A1E4D; --dani-mark: #43318A; --dani-ink: #D3C3FF;
    --neutral: #AAB6CB; --neutral-soft: #1F2837; --neutral-mark: #33415A; --neutral-ink: #D6DEEC;
    --on-c: #0B1220; --shadow: 0 1px 2px rgba(0,0,0,.4), 0 6px 18px rgba(0,0,0,.3);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0D121A; --surface: #161D29; --ink: #E7ECF5; --muted: #9AA7BC; --line: #263143; --line-strong: #3A4960;
  --haces: #1F2837; --aparece: #3A3014; --aparece-ink: #F3D58A; --pasa: #3D2417; --pasa-ink: #FFC6A3;
  --rosa: #7DAAFF; --rosa-soft: #17284A; --rosa-mark: #27437A; --rosa-ink: #BDD3FF;
  --cris: #5CD09B; --cris-soft: #12301F; --cris-mark: #1F5238; --cris-ink: #A5EBC9;
  --dani: #AC8BFF; --dani-soft: #2A1E4D; --dani-mark: #43318A; --dani-ink: #D3C3FF;
  --neutral: #AAB6CB; --neutral-soft: #1F2837; --neutral-mark: #33415A; --neutral-ink: #D6DEEC;
  --on-c: #0B1220; --shadow: 0 1px 2px rgba(0,0,0,.4), 0 6px 18px rgba(0,0,0,.3);
  color-scheme: dark;
}

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 16px; line-height: 1.55; margin: 0; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 20; background: var(--surface); }
h1, h2, h3, h4 { font-family: var(--font-display); text-wrap: balance; margin: 0; line-height: 1.15; }
p { margin: 0; }
code { font-family: var(--font-mono); font-size: .86em; background: var(--haces); color: var(--ink); padding: .12em .42em; border-radius: 6px; overflow-wrap: anywhere; }
a { color: inherit; }
:focus-visible { outline: 3px solid var(--c, var(--rosa)); outline-offset: 2px; border-radius: 6px; }

.wrap { max-width: 1180px; margin-inline: auto; padding-inline: max(16px, env(safe-area-inset-left, 0px)) max(16px, env(safe-area-inset-right, 0px)); }

/* Personas */
.p-rosa { --c: var(--rosa); --soft: var(--rosa-soft); --mark: var(--rosa-mark); --cink: var(--rosa-ink); }
.p-cris { --c: var(--cris); --soft: var(--cris-soft); --mark: var(--cris-mark); --cink: var(--cris-ink); }
.p-dani { --c: var(--dani); --soft: var(--dani-soft); --mark: var(--dani-mark); --cink: var(--dani-ink); }
.p-all  { --c: var(--neutral); --soft: var(--neutral-soft); --mark: var(--neutral-mark); --cink: var(--neutral-ink); }

/* Cabecera fija */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 15; background: var(--surface); border-bottom: 1px solid var(--line); }
.top .wrap { padding-block: 12px 10px; display: grid; gap: 10px; }
.brand { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.brand h1 { font-size: 1.25rem; font-weight: 800; letter-spacing: -.01em; }
.brand span { color: var(--muted); font-size: .85rem; }
.tabs { display: flex; flex-wrap: wrap; gap: 6px; }
.tab { text-decoration: none; font-weight: 600; font-size: .92rem; padding: 7px 14px; border-radius: 999px; background: var(--haces); color: var(--ink); border: 2px solid transparent; display: inline-flex; align-items: center; gap: 8px; }
.tab i { width: 10px; height: 10px; border-radius: 50%; background: var(--c, var(--neutral)); display: inline-block; }
.tab:hover { border-color: var(--line-strong); }
.tab[aria-current="page"] { background: var(--c, var(--neutral)); color: var(--on-c); }
.tab[aria-current="page"] i { background: var(--on-c); }
.controls { display: flex; flex-wrap: wrap; gap: 8px; }
.toggle { font: inherit; font-size: .85rem; font-weight: 600; cursor: pointer; padding: 6px 12px; border-radius: 8px; border: 1.5px solid var(--line-strong); background: transparent; color: var(--ink); }
.toggle[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }

/* Paneles */
main { padding-block: 22px 56px; }
.panel { display: none; }
.panel.on { display: block; }

/* Cabecera de persona */
.who { background: var(--c); color: var(--on-c); border-radius: 20px; padding: 24px 24px 22px; display: grid; gap: 12px; margin-bottom: 18px; }
.who h2 { font-size: clamp(2rem, 6vw, 2.9rem); font-weight: 800; letter-spacing: -.02em; }
.who .sub { font-size: 1.08rem; font-weight: 500; max-width: 60ch; }
.who .meta { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 4px; }
.pill { font-size: .82rem; font-weight: 600; padding: 4px 12px; border-radius: 999px; background: color-mix(in srgb, var(--on-c) 20%, transparent); }

/* Pasos */
.steps { display: grid; gap: 16px; }
.step { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 18px; display: grid; gap: 12px; box-shadow: var(--shadow); }
.step-head { display: flex; align-items: center; gap: 12px; }
.num { flex: none; width: 38px; height: 38px; border-radius: 50%; background: var(--c); color: var(--on-c); font-family: var(--font-display); font-weight: 800; display: grid; place-items: center; font-size: 1.05rem; }
.step-head h3 { font-size: 1.18rem; font-weight: 700; flex: 1; min-width: 0; }
.done { display: inline-flex; align-items: center; gap: 7px; font-size: .82rem; font-weight: 600; color: var(--muted); cursor: pointer; flex: none; }
.done input { width: 18px; height: 18px; accent-color: var(--c); margin: 0; }
.step.is-done { border-color: var(--c); }
.step.is-done .done { color: var(--cink); }

.row { border-radius: 12px; padding: 10px 14px; display: grid; gap: 3px; }
.tag { font-size: .7rem; font-weight: 700; letter-spacing: .09em; text-transform: uppercase; }
.haces { background: var(--haces); }
.haces .tag { color: var(--muted); }
.aparece { background: var(--aparece); color: var(--aparece-ink); }
.aparece .tag { color: var(--aparece-ink); opacity: .85; }

.say { position: relative; background: var(--soft); border-radius: 18px 18px 18px 4px; padding: 14px 18px 16px; display: grid; gap: 6px; }
.say .tag { color: var(--cink); }
.say .txt { font-size: 1.08rem; line-height: 1.65; }
.say b { background: var(--mark); color: var(--cink); font-weight: 600; padding: .04em .28em; border-radius: 5px; }
.cover .say .txt { filter: blur(8px); user-select: none; }
.cover .say:not(.shown) { cursor: pointer; }
.cover .say:not(.shown)::after { content: "Toca para ver"; position: absolute; inset: 0; display: grid; place-items: center; font-weight: 700; color: var(--cink); }
.cover .say.shown .txt { filter: none; }

.terms { border: 1.5px dashed var(--line-strong); border-radius: 14px; padding: 12px 14px; display: grid; gap: 10px; }
.terms > .tag { color: var(--cink); }
.nomean .terms { display: none; }
dl { margin: 0; display: grid; gap: 8px; }
.term { display: grid; gap: 1px; }
.term dt { font-weight: 700; color: var(--cink); font-size: .95rem; }
.term dd { margin: 0; font-size: .94rem; color: var(--ink); }
.ask { background: var(--soft); border-radius: 12px; }
.ask summary { cursor: pointer; padding: 10px 14px; font-weight: 600; font-size: .94rem; color: var(--cink); list-style: none; display: flex; gap: 8px; }
.ask summary::-webkit-details-marker { display: none; }
.ask summary::before { content: "?"; flex: none; width: 22px; height: 22px; border-radius: 50%; background: var(--c); color: var(--on-c); display: grid; place-items: center; font-size: .8rem; font-weight: 800; margin-top: 1px; }
.ask p { padding: 0 14px 12px 44px; font-size: .94rem; }

.step.pass { background: var(--pasa); border-color: transparent; }
.step.pass .num { background: var(--pasa-ink); color: var(--pasa); font-size: 1.2rem; }
.step.pass .say { background: var(--surface); }
.step.pass .haces { background: color-mix(in srgb, var(--surface) 55%, transparent); }
.step.pass h3 { color: var(--pasa-ink); }

/* Inicio */
.lead { font-size: 1.15rem; max-width: 60ch; margin-bottom: 18px; }
.flow { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 26px; }
.flow a { text-decoration: none; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 16px; display: grid; gap: 4px; box-shadow: var(--shadow); position: relative; min-width: 0; }
.flow a:hover { border-color: var(--c); }
.flow .n { font-family: var(--font-display); font-weight: 800; font-size: 1.5rem; color: var(--c); }
.flow .t { font-size: .92rem; color: var(--muted); }
.flow .s { font-size: .8rem; font-weight: 700; color: var(--cink); background: var(--soft); border-radius: 999px; padding: 3px 10px; justify-self: start; margin-top: 4px; }
h2.sec { font-size: 1.45rem; font-weight: 800; margin: 28px 0 12px; }
.legend { display: grid; gap: 8px; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 16px; }
.legend .row { grid-template-columns: 120px 1fr; align-items: center; gap: 12px; }
.legend .row .tag { align-self: center; }
.ready { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 14px 16px; display: grid; gap: 6px; box-shadow: var(--shadow); min-width: 0; }
.card h4 { font-size: 1.05rem; font-weight: 800; color: var(--cink); }
.card.wide { grid-column: 1 / -1; }
.note { background: var(--soft); border-radius: 14px; padding: 14px 16px; }
.note + .note { margin-top: 10px; }

/* Glosario */
.search { width: 100%; font: inherit; padding: 12px 14px; border-radius: 12px; border: 1.5px solid var(--line-strong); background: var(--surface); color: var(--ink); margin-bottom: 8px; }
.gcat { margin-top: 22px; }
.gcat h3 { font-size: 1.15rem; font-weight: 800; margin-bottom: 10px; display: flex; align-items: center; gap: 8px; }
.gcat h3::before { content: ""; width: 12px; height: 12px; border-radius: 4px; background: var(--c); }
.gl { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
.gl .term { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; min-width: 0; }
.empty { color: var(--muted); padding: 16px 0; }

/* Ensayar */
.stages { display: grid; gap: 10px; counter-reset: st; }
.stage { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 14px 16px 14px 62px; position: relative; box-shadow: var(--shadow); counter-increment: st; }
.stage::before { content: counter(st); position: absolute; left: 14px; top: 12px; width: 36px; height: 36px; border-radius: 50%; background: var(--ink); color: var(--bg); display: grid; place-items: center; font-family: var(--font-display); font-weight: 800; }
.qa-group { margin-top: 18px; display: grid; gap: 8px; }
.qa-group h3 { font-size: 1.1rem; font-weight: 800; color: var(--cink); }
.bar { display: flex; flex-wrap: wrap; gap: 8px; margin: 10px 0 4px; }


/* Dos columnas por paso: lo que haces y dices a la izquierda, lo que significa a la derecha */
.cols { display: contents; }
.col-a, .col-b { display: grid; gap: 12px; min-width: 0; align-content: start; }
@media (min-width: 860px), print {
  .step { grid-template-columns: minmax(0, 1.12fr) minmax(0, 1fr); column-gap: 18px; row-gap: 12px; align-items: start; }
  .step-head { grid-column: 1 / -1; }
  .step.solo .col-a { grid-column: 1 / -1; }
  .step.solo .col-a { grid-template-columns: minmax(0, 1fr); }
  .gl { grid-template-columns: repeat(3, 1fr); }
  .qa-group { grid-template-columns: repeat(2, minmax(0, 1fr)); align-items: start; }
  .qa-group > h3 { grid-column: 1 / -1; }
  .steps { gap: 14px; }
}

@media (max-width: 640px) {
  .flow, .ready, .gl { grid-template-columns: 1fr; }
  .legend .row { grid-template-columns: 1fr; gap: 4px; }
  .who { padding: 20px 18px; border-radius: 16px; }
  .step { padding: 14px; border-radius: 16px; }
  .step-head { flex-wrap: wrap; }
  .done { margin-left: 50px; }
  .ask p { padding-left: 14px; }
}
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; transition: none !important; } }
@media print {
  body { background: #fff; color: #111; font-size: 12px; }
  body::before, .top, .controls, .done, .search, .bar { display: none !important; }
  .panel { display: block !important; margin-bottom: 0; }
  .panel.p-rosa, .panel.p-cris, .panel.p-dani { break-before: page; }
  .who { break-after: avoid; padding: 16px 20px; margin-bottom: 12px; border-radius: 12px; }
  .who h2 { font-size: 2rem; }
  .steps { display: block; }
  .step { display: block; padding: 12px; border-radius: 12px; margin-bottom: 10px; break-inside: auto; }
  .step-head { break-after: avoid; margin-bottom: 8px; }
  .cols { display: block; column-count: 2; column-gap: 16px; column-fill: balance; }
  .step.solo .cols { column-count: 1; }
  .col-a, .col-b { display: contents; }
  .cols > .col-a > *, .cols > .col-b > * { margin-bottom: 8px; }
  .row, .say, .terms, .term, .ask { break-inside: avoid; }
  .terms { display: block; }
  .terms .term { margin-top: 8px; }
  h2.sec { margin: 14px 0 8px; font-size: 1.2rem; }
  .lead { font-size: 1rem; margin-bottom: 10px; }
  .flow { margin-bottom: 12px; }
  .flow a { padding: 10px; }
  .legend { padding: 10px; gap: 5px; }
  .card { padding: 8px 12px; }
  .ready { gap: 8px; }
  .note { padding: 8px 12px; }
  .note + .note { margin-top: 6px; }
  main { padding-block: 0; }
  .haces { break-after: avoid; }
  .say .txt { font-size: 1rem; line-height: 1.55; }
  .term dd, .ask p, .ask summary { font-size: .88rem; }
  .card, .stage { break-inside: avoid; }
  .step, .card, .stage { box-shadow: none; }
  .who { print-color-adjust: exact; -webkit-print-color-adjust: exact; }
  .say, .haces, .aparece, .step.pass, .say b, .num, .tag { print-color-adjust: exact; -webkit-print-color-adjust: exact; }
  .cover .say .txt { filter: none !important; }
  .cover .say::after { display: none !important; }
  .nomean .terms { display: grid !important; }
}
</style>

</head>
<body>
<header class="top">
  <div class="wrap">
    <div class="brand"><h1>Guion de la demo</h1><span>MongoDB · Distribuidora Gas El Volcán</span></div>
    <nav class="tabs" aria-label="Secciones">
      <a class="tab p-all" href="#inicio" data-tab="inicio"><i></i>Inicio</a>
      <a class="tab p-rosa" href="#rosa" data-tab="rosa"><i></i>Rosa</a>
      <a class="tab p-cris" href="#cristopher" data-tab="cristopher"><i></i>Cristopher</a>
      <a class="tab p-dani" href="#daniel" data-tab="daniel"><i></i>Daniel</a>
      <a class="tab p-all" href="#glosario" data-tab="glosario"><i></i>Glosario</a>
      <a class="tab p-all" href="#ensayar" data-tab="ensayar"><i></i>Ensayar</a>
    </nav>
    <div class="controls" id="controls" hidden>
      <button class="toggle" id="t-cover" type="button" aria-pressed="false">Tapar lo que dices</button>
      <button class="toggle" id="t-mean" type="button" aria-pressed="false">Ocultar qué significa</button>
    </div>
  </div>
</header>

<main class="wrap" id="app"></main>

<script>
/* ---------- Diccionario de términos (se usa en los pasos y en el Glosario) ---------- */
var T = {
  relacional: ["Modelo relacional", "Los datos van en tablas con filas y columnas fijas, y las tablas se conectan entre sí con claves. Es el modelo de Oracle, el que usamos en el EP1 y el EP2.", "Modelo de datos"],
  join: ["JOIN", "Una consulta que une filas de dos o más tablas por un campo en común, por ejemplo el id del cliente, para ver los datos juntos.", "Modelo de datos"],
  documento: ["Documento", "Un registro que guarda sus campos y valores juntos, y puede llevar listas y otros datos adentro. Se escribe parecido a JSON.", "Modelo de datos"],
  json: ["JSON y BSON", "JSON es un formato de texto para guardar datos como pares campo: valor. MongoDB lo guarda en una versión binaria llamada BSON.", "Modelo de datos"],
  coleccion: ["Colección", "El equivalente a una tabla: un grupo de documentos. Nuestra base tiene cuatro: productos, clientes, pedidos e historial_productos.", "Modelo de datos"],
  bd: ["Base de datos (gas_volcan)", "El contenedor de todo nuestro proyecto en MongoDB. Dentro van las colecciones.", "Modelo de datos"],
  id: ["_id", "El campo que identifica de forma única a cada documento, como una clave primaria. En productos es el código (CL001), y en pedidos y clientes es el número.", "Modelo de datos"],
  esquema: ["Esquema flexible", "No todos los documentos necesitan los mismos campos. Sirve para un catálogo con productos muy distintos. Por defecto MongoDB no obliga a una estructura fija.", "Modelo de datos"],
  normalizar: ["Normalizar", "Separar los datos en varias tablas para no repetirlos. Es lo que hace Oracle con el pedido: cliente, pedido, detalle y producto van por separado.", "Modelo de datos"],
  embebido: ["Embebido", "Guardar los datos relacionados dentro del mismo documento. Las líneas del pedido viven adentro del pedido, así que se leen de una vez y sin JOIN.", "Modelo de datos"],
  referenciado: ["Referenciado", "Guardar solo el id del otro documento y buscarlo aparte. El pedido guarda el id del cliente, como una clave foránea.", "Modelo de datos"],
  copia: ["Copia del momento", "Un dato que se copia al guardar y después no se actualiza solo. El pedido guarda el nombre y el tipo del cliente de ese día, aunque el cliente cambie más adelante.", "Modelo de datos"],
  validacion: ["Validación ($jsonSchema)", "Reglas que MongoDB revisa cada vez que se guarda un documento: campos obligatorios, tipos y valores permitidos. En nuestra base el stock no puede ser menor que 0.", "Reglas de la base"],
  check: ["CHECK de Oracle", "Una restricción de Oracle que impide guardar datos que no cumplen una condición. La validación de MongoDB hace lo mismo.", "Reglas de la base"],
  trigger: ["Trigger", "Código que la base ejecuta sola cuando algo cambia. En Oracle, un trigger anotaba el historial. En nuestra base MongoDB no hay triggers: lo anota el programa.", "Reglas de la base"],
  atomica: ["Operación atómica", "Se hace completa o no se hace nada. Cuando todo está en un solo documento, MongoDB guarda los cambios juntos.", "Reglas de la base"],
  replica: ["Transacción y replica set", "Una transacción hace varios cambios en documentos distintos como si fueran uno solo. En MongoDB necesita un replica set (varios servidores con copias), que nuestra base local no tiene.", "Reglas de la base"],
  integridad: ["Integridad y consistencia", "Que los datos sean correctos y coherentes entre sí. Oracle lo protege con restricciones y triggers dentro de la base. En MongoDB queda más en manos del programa.", "Reglas de la base"],
  crud: ["CRUD", "Las cuatro operaciones básicas con datos: Create (crear), Read (leer), Update (actualizar) y Delete (borrar).", "Comandos"],
  insertone: ["insertOne e insertMany", "insertOne agrega un documento. insertMany agrega varios de una vez.", "Comandos"],

    '<h2 class="sec">Qué debe estar listo antes de empezar</h2>' +
    '<div class="ready">' +
      '<div class="card wide p-all"><h4>Todos</h4><p>Un solo computador: el que tiene MongoDB y la página. Compass conectado a <code>localhost:27017</code>, con la consola de mongosh abierta y el script 01 recién pegado (debe decir 14 productos, 9 clientes y 10 pedidos). Además, el script <code>00_DEMO_en_orden.js</code> abierto: ahí está todo lo que se pega en la demo, en el mismo orden de esta página y con los mismos números de paso. Nada se escribe a mano.</p></div>' +
      '<div class="card p-rosa"><h4>Rosa</h4><p>Las 2 diapositivas abiertas, y el script en la Parte 1 (pasos 3 a 7).</p></div>' +
      '<div class="card p-cris"><h4>Cristopher</h4><p>El script abierto en la Parte 2 (pasos 1 a 7).</p></div>' +
      '<div class="card wide p-dani"><h4>Daniel</h4><p>El script abierto en la Parte 3 (pasos 1, 2 y 4). El servidor (<code>node server.cjs</code>) y la página (<code>npm run dev</code>) levantados, la página en <code>localhost:5173</code> con sesión de administrador, y F12 abierto en Network con Fetch/XHR, Keep log y Disable cache marcados.</p></div>' +
    '</div>' +
    '<h2 class="sec">Dos cosas que saber</h2>' +
    '<div class="note p-all">Los pasos del script se pegan en orden, de arriba hacia abajo, porque cada uno usa lo que dejó el anterior. El paso 6 de Rosa (C1 a C4) se pega aunque no se explique uno por uno: crea los datos de prueba que después borra el Delete.</div>' +
    '<div class="note p-all">Al ensayar, revisen qué muestra Compass cuando se pegan varios comandos juntos. Si solo muestra el último resultado, peguen los comandos de a uno, rápido.</div>' +
  '</section>';
}

function glosarioPanel() {
  var cats = {}, order = [];
  Object.keys(T).forEach(function (k) {
    var c = T[k][2];
    if (!cats[c]) { cats[c] = []; order.push(c); }
    cats[c].push(T[k]);
  });
  var html = order.map(function (c) {
    return '<div class="gcat p-all" data-cat><h3>' + c + '</h3><dl class="gl">' + cats[c].map(function (x) { return termHTML(x); }).join("") + '</dl></div>';
  }).join("");
  return '<section class="panel p-all" id="panel-glosario">' +
    '<div class="who"><h2>Glosario</h2><p class="sub">Todas las palabras técnicas de la demo, con una explicación corta. Si el profe pregunta qué es algo, la respuesta está aquí.</p></div>' +
    '<label for="gq" class="tag" style="display:block;margin-bottom:6px;color:var(--muted)">Buscar una palabra</label>' +
    '<input class="search" id="gq" type="search" placeholder="Por ejemplo: embebido, $set, GET" autocomplete="off">' +
    '<div id="gl-body">' + html + '</div><p class="empty" id="gl-empty" hidden>No hay ninguna palabra con ese texto.</p></section>';
}

function ensayarPanel() {
  var qa = ORDER.map(function (k) {
    var p = PEOPLE[k], list = [];
    p.steps.forEach(function (s) { (s.q || []).forEach(function (q) { list.push(q); }); });
    return '<div class="qa-group ' + p.cls + '"><h3>Parte de ' + p.name + '</h3>' + list.map(function (q) {
      return '<details class="ask"><summary>' + q[0] + '</summary><p>' + q[1] + '</p></details>';
    }).join("") + '</div>';
  }).join("");
  return '<section class="panel p-all" id="panel-ensayar">' +
    '<div class="who"><h2>Ensayar</h2><p class="sub">Cuatro etapas, en este orden. La meta es una demo de unos 10 minutos. Antes de cada ensayo completo, vuelvan a pegar el script 01 para dejar los datos limpios.</p></div>' +
    '<div class="stages">' +
      '<div class="stage">Cada uno ensaya solo su parte: lee sus pasos y pega los de su parte del script en Compass hasta que el resultado coincida con lo que dice Aparece. Usa el botón Tapar lo que dices para practicar sin leer.</div>' +
      '<div class="stage">Ensayo completo con cronómetro, pasándose el teclado en los pasos de pasar la palabra.</div>' +
      '<div class="stage">Intercambio: cada uno explica con sus palabras la parte de otro. La nota es individual y el profe puede preguntarle a cualquiera sobre cualquier bloque.</div>' +
      '<div class="stage">Último ensayo como si fuera el real, sin leer las frases, y después repasar juntos las preguntas de abajo.</div>' +
    '</div>' +
    '<div class="note p-all" style="margin-top:14px">Si falta tiempo el día de la demo, se salta la parte de la página web (los pasos 3 y 4 de Daniel).</div>' +
    '<h2 class="sec">Preguntas que podría hacer el profe</h2>' +
    '<p>Léanlas, contesten en voz alta y recién ahí abran la respuesta.</p>' +
    '<div class="bar"><button class="toggle" type="button" id="qa-open">Abrir todas</button><button class="toggle" type="button" id="qa-close">Cerrar todas</button></div>' +
    qa + '</section>';
}

app.innerHTML = inicioPanel() + ORDER.map(function (k) { return personPanel(PEOPLE[k]); }).join("") + glosarioPanel() + ensayarPanel();

/* ---------- Progreso ---------- */
function updateProgress() {
  ORDER.forEach(function (k) {
    var p = PEOPLE[k], total = 0, n = 0;
    p.steps.forEach(function (s, i) { if (!s.pass) { total++; if (done[k + "-" + (i + 1)]) n++; } });
    var el = document.getElementById("prog-" + k);
    if (el) el.textContent = n + " de " + total + " ensayados";
  });
}
updateProgress();
app.addEventListener("change", function (e) {
  var id = e.target && e.target.getAttribute && e.target.getAttribute("data-done");
  if (!id) return;
  if (e.target.checked) done[id] = 1; else delete done[id];
  var card = document.getElementById(id);
  if (card) card.classList.toggle("is-done", e.target.checked);
  saveDone(); updateProgress();
});

/* ---------- Tapar frases y ocultar explicaciones ---------- */
var tCover = document.getElementById("t-cover"), tMean = document.getElementById("t-mean");
tCover.addEventListener("click", function () {
  var on = tCover.getAttribute("aria-pressed") !== "true";
  tCover.setAttribute("aria-pressed", String(on));
  document.body.classList.toggle("cover", on);
  document.querySelectorAll(".say.shown").forEach(function (el) { el.classList.remove("shown"); });
});
tMean.addEventListener("click", function () {
  var on = tMean.getAttribute("aria-pressed") !== "true";
  tMean.setAttribute("aria-pressed", String(on));
  document.body.classList.toggle("nomean", on);
});
function revealSay(el) { if (document.body.classList.contains("cover")) el.classList.toggle("shown"); }
app.addEventListener("click", function (e) { var s = e.target.closest && e.target.closest(".say"); if (s) revealSay(s); });
app.addEventListener("keydown", function (e) {
  if ((e.key === "Enter" || e.key === " ") && e.target.classList && e.target.classList.contains("say") && document.body.classList.contains("cover")) {
    e.preventDefault(); revealSay(e.target);
  }
});

/* ---------- Glosario: búsqueda ---------- */
function norm(s) { return s.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, ""); }
document.getElementById("gq").addEventListener("input", function (e) {
  var q = norm(e.target.value.trim()), any = false;
  document.querySelectorAll("#gl-body [data-cat]").forEach(function (cat) {
    var shown = 0;
    cat.querySelectorAll(".term").forEach(function (t) {
      var ok = !q || norm(t.textContent).indexOf(q) !== -1;
      t.hidden = !ok; if (ok) shown++;
    });
    cat.hidden = shown === 0; if (shown) any = true;
  });
  document.getElementById("gl-empty").hidden = any;
});

/* ---------- Ensayar: abrir y cerrar preguntas ---------- */
document.getElementById("qa-open").addEventListener("click", function () { document.querySelectorAll("#panel-ensayar details").forEach(function (d) { d.open = true; }); });
document.getElementById("qa-close").addEventListener("click", function () { document.querySelectorAll("#panel-ensayar details").forEach(function (d) { d.open = false; }); });

/* ---------- Pestañas por hash ---------- */
var VALID = ["inicio", "rosa", "cristopher", "daniel", "glosario", "ensayar"];
function route() {
  var h = (location.hash || "").replace("#", "");
  if (VALID.indexOf(h) === -1) h = "inicio";
  document.querySelectorAll(".panel").forEach(function (p) { p.classList.toggle("on", p.id === "panel-" + h); });
  document.querySelectorAll(".tab").forEach(function (t) {
    if (t.getAttribute("data-tab") === h) t.setAttribute("aria-current", "page"); else t.removeAttribute("aria-current");
  });
  document.getElementById("controls").hidden = ORDER.indexOf(h) === -1;
  window.scrollTo(0, 0);
}
window.addEventListener("hashchange", route);
route();
</script>
</body>
</html>
